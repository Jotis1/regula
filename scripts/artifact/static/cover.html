<!-- @dsCard height=288 -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Jotis.me</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg-primary); color:var(--text-primary); font-family:var(--font-body); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; }
  .art svg { display:block; }
  .brand { fill:var(--bg-brand-solid); }
  .tint { fill:var(--utility-brand-200); }
  .ink { fill:var(--bg-primary-solid); }
  .quiet { fill:var(--bg-quaternary); }
  .on-brand { fill:var(--text-secondary_on-brand); }
  .cut { fill:var(--bg-primary); }
  .blk { rx:var(--radius-xl); }
  .words { position:absolute; left:var(--spacing-4xl); bottom:var(--spacing-4xl); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-weight:600; font-size:88px; line-height:.92; letter-spacing:-.02em; color:var(--text-primary); }
  .tag { margin:var(--spacing-md) 0 0 2px; font-size:14px; line-height:20px; color:var(--text-tertiary); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      bg-brand-solid 192×256 slab bleeding off the top (the one identity hue, largest) · bg-primary-solid 152×136 · utility-brand-200 152×104 · bg-quaternary 64×64 — ≈40% of 960×288
  arrangement one tall indigo slab with satellites stacked to its right, edges on spacing-xl gutters, bottoms on one line spacing-4xl above the edge
  pattern     discs and crescents, from the moon logomark and the radius-full pills/avatars/toggles: three moon phases cut into the slab, a disc ring on the ink block
  scales      gutters spacing-xl (16); sides in spacing-4xl (32) multiples; corners radius-xl; discs radius-full
-->
<rect class="brand blk" x="32" y="-24" width="192" height="256" rx="12"/>
<circle class="tint" cx="128" cy="72" r="40"/><circle class="brand" cx="144" cy="64" r="34"/>
<circle class="on-brand" cx="80" cy="168" r="20"/><circle class="brand" cx="90" cy="162" r="17"/>
<circle class="on-brand" cx="168" cy="184" r="12"/>
<rect class="ink blk" x="240" y="96" width="152" height="136" rx="12"/>
<circle class="cut" cx="316" cy="164" r="40"/><circle class="ink" cx="330" cy="156" r="34"/>
<rect class="tint blk" x="240" y="-24" width="152" height="104" rx="12"/>
<rect class="quiet blk" x="408" y="168" width="64" height="64" rx="12"/>
</svg>
</div>
<div class="words">
<h1 class="name">Jotis.me</h1>
<p class="tag">Grises neutros, un índigo y Geist. Claro y oscuro.</p>
</div>
</div>
</body>
</html>
