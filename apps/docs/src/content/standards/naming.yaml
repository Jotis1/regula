prefix: NAM
title: Nombres
description: Cómo se llaman los paquetes de la suite, para que se sepa de quién son y dónde viven con solo leer el nombre.
order: 1
rules:
    - id: NAM-001
      title: Los paquetes privados se llaman como su dominio, al revés
      level: must
      appliesTo: all
      statement: >-
          El `name` de un paquete privado es el dominio del producto escrito al revés (`me.jotis.regula`). Si el paquete
          no se despliega con dominio propio, es el nombre de su padre más un segmento (`me.jotis.regula.docs`). Los
          segmentos van separados por puntos, en minúsculas y con guiones dentro de cada uno.
      rationale: >-
          Es la notación de dominio inverso de Java, Android e iOS. Un nombre así no choca con ninguno de npm, dice de
          quién es el paquete y agrupa solo los que son del mismo producto. Un `docs` o un `example-astro` sueltos no
          dicen de quién son.
      examples:
          good:
              - caption: La web de Regula y su ejemplo en Astro
                lang: json
                code: |-
                    // apps/docs/package.json
                    { "name": "me.jotis.regula.docs", "private": true }

                    // examples/astro/package.json
                    { "name": "me.jotis.regula.example.astro", "private": true }
          bad:
              - caption: Nombres sueltos, sin dueño
                lang: json
                code: |-
                    // apps/docs/package.json
                    { "name": "docs", "private": true }

                    // examples/astro/package.json
                    { "name": "example-astro", "private": true }
      verification:
          kind: ci
          check: Nombres de paquete

    - id: NAM-002
      title: Los paquetes publicados usan el scope de la organización
      level: must
      appliesTo: package
      statement: >-
          Todo paquete que se publica en npm se llama `@jotis-me/<nombre>`, con el nombre en minúsculas y con guiones.
      rationale: >-
          En npm los nombres sin scope se reparten por orden de llegada: cualquiera podría registrar `me.jotis.regula.react`
          antes que nosotros o publicar uno parecido. El scope `@jotis-me` es un espacio de nombres reservado a la
          organización, y quien instala sabe de quién es el paquete.
      examples:
          good:
              - caption: Un paquete publicado
                lang: json
                code: |-
                    { "name": "@jotis-me/react", "version": "0.10.0" }
          bad:
              - caption: Un paquete publicado con nombre en dominio inverso
                lang: json
                code: |-
                    { "name": "me.jotis.regula.react", "version": "0.10.0" }
      verification:
          kind: ci
          check: Nombres de paquete

    - id: NAM-003
      title: Los archivos se llaman en kebab-case, y los componentes pueden ir en PascalCase
      level: must
      appliesTo: all
      statement: >-
          Los nombres de archivo van en kebab-case (`format-date.ts`, `button.test.tsx`) y solo en ASCII. Los archivos de
          componente (`.tsx` y `.astro`) pueden ir también en PascalCase, con el nombre del componente (`DatePicker.tsx`,
          `InlineCTA.tsx`: las siglas se admiten). Las rutas de Next y de Astro cumplen tal como las pide cada framework.
      rationale: >-
          Un solo criterio evita que la misma carpeta mezcle `formatDate.ts`, `format_date.ts` y `FormatDate.ts`, y que
          un sistema que no distingue mayúsculas, como el de Windows, trate dos nombres como uno. El PascalCase de un
          componente deja ver al abrir la carpeta cuál es el componente.
      examples:
          good:
              - caption: Una utilidad en kebab-case junto a su componente
                lang: text
                code: |-
                    format-date.ts
                    DatePicker.tsx
                    date-picker.test.tsx
          bad:
              - caption: Una utilidad en camelCase
                lang: text
                code: |-
                    formatDate.ts
      exceptions:
          - where: "`**/*.tsx` y `**/*.astro`"
            why: Un componente puede ir en PascalCase porque así se llama su export, y las siglas (`InlineCTA`) se admiten.
          - where: Las rutas dinámicas de Next y de Astro (`[slug].astro`, `[...slug].astro`, `[[...slug]]`)
            why: Los frameworks las nombran con corchetes y puntos suspensivos, y así las reconocen.
      verification:
          kind: biome
          check: useFilenamingConvention
