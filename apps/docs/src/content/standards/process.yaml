prefix: PRO
title: Proceso
description: Cómo se decide un cambio antes de escribirlo, y cómo se queda registrado.
order: 10
rules:
    - id: PRO-001
      title: Los cambios no triviales se proponen con OpenSpec antes del código
      level: must
      appliesTo: all
      statement: >-
          Todo cambio no trivial pasa por OpenSpec (propuesta, specs, diseño y tareas) antes de tocar el código. Son
          triviales las erratas, los cambios de formato, las subidas de dependencias sin cambios de API y los arreglos
          de una línea sin cambio de comportamiento.
      rationale: >-
          Un agente (o una persona) que programa sin spec decide a su manera lo que no está escrito. Con la spec delante,
          el cambio se revisa contra lo pedido y no contra lo que parece razonable.
      examples:
          good:
              - caption: Un cambio con su propuesta antes del código
                lang: bash
                code: |-
                    /opsx:propose add-chat-select-affordance
                    # revisar la propuesta, el diseño, las specs y las tareas
                    /opsx:apply add-chat-select-affordance
          bad:
              - caption: Una prop nueva en un componente, sin ningún cambio de OpenSpec que la describa
                lang: text
                code: |-
                    PR #41: feat(react): Button gana la prop `loadingLabel`
                      packages/react/src/components/Button.tsx   +18 -2
                      openspec/changes/                           (sin cambios)
      verification:
          kind: review
          review: Que toda PR con cambio de comportamiento traiga o archive un cambio de OpenSpec.

    - id: PRO-002
      title: La spec y el código llegan sincronizados
      level: must
      appliesTo: all
      statement: >-
          La PR que implementa un cambio deja las specs describiendo lo que hace el código. Si al implementar se decide
          algo distinto de lo propuesto, se actualiza el artefacto antes de fusionar.
      rationale: >-
          Una spec que no coincide con el código es peor que no tener spec: el siguiente agente se fía de ella.
      examples:
          good:
              - caption: Se cambia el diseño y se actualiza el artefacto en la misma PR
                lang: text
                code: |-
                    fix(docs): el historial pinta sublistas
                      apps/docs/src/lib/changelog.ts
                      openspec/changes/clarify-chat-selection/design.md   (D6 actualizado)
          bad:
              - caption: El código hace otra cosa y la spec sigue diciendo lo anterior
                lang: text
                code: |-
                    Spec:   «La marca sale siempre»
                    Código: la marca solo sale al pasar por encima
      verification:
          kind: review
          review: Que lo que dicen las specs del cambio coincida con lo que hace el código de la PR.

    - id: PRO-003
      title: Lo que no tiene norma se decide con un orden y se anota
      level: must
      appliesTo: all
      statement: >-
          Que no haya norma no permite ni prohíbe nada por sí solo. Se decide en este orden: lo que busca la norma más
          cercana; la convención oficial del framework o de la herramienta; lo que ya hace el repo; y, si queda empate,
          lo más simple (COD-014). La PR dice qué caso no tenía norma, qué se decidió y por qué. La segunda vez que
          aparece el mismo caso, o la primera si afecta a más de un proyecto, se propone la norma con OpenSpec.
      rationale: >-
          Ninguna guía lo cubre todo. Sin un orden, cada persona o agente inventa una regla distinta, o aplica una que
          no existe como si existiera. Anotar el caso deja ver los huecos, y proponer la norma cuando se repite evita
          que una costumbre acabe siendo norma sin que nadie la haya decidido.
      examples:
          good:
              - caption: La PR nombra el hueco, la decisión y su porqué
                lang: md
                code: |-
                    **Sin norma:** dónde van los workers de la app.
                    **Decisión:** `src/features/sync/workers/`, como la carpeta por tipo de una funcionalidad (lo
                    que busca STR-005), porque solo los usa la sincronización.
          bad:
              - caption: Una regla inventada, aplicada como si existiera
                lang: md
                code: |-
                    Muevo los workers a `src/workers/`, que es lo que dice la norma.
      verification:
          kind: review
          review: >-
              Que cada decisión sin norma esté anotada en la PR con su porqué, y que un caso que ya salió antes traiga
              su propuesta de norma.
