<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cabecera móvil de Regula</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="lib/tokens.css">
<link rel="stylesheet" href="ds/jotis/components/bundle.css">
<link rel="stylesheet" href="lib/regula.css">
<script src="ds/jotis/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<header class="jm-root rg-root" style="position: relative; display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 6px 0 16px; background: var(--bg-primary); box-shadow: inset 0 -1px 0 var(--border-secondary); font-family: var(--font-body); color: var(--text-primary);">
  <a class="rg-skip" href="#contenido">Saltar al contenido</a>
  <a href="/" aria-label="Regula, portada" style="display: flex; align-items: center; gap: 8px; min-height: 44px; color: var(--text-primary); text-decoration: none;">
    <x-import component-from-global-scope="Jotis.AppIcon" letters="Re" hue="fuchsia" label="Regula" size="{{n.s24}}" aria-hidden="true" style="display: flex;"></x-import>
    <span style="font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 28px; letter-spacing: -0.02em;">Regula</span>
  </a>
  <div style="flex-grow: 1;"></div>
  <x-import component-from-global-scope="Jotis.Button" hierarchy="tertiary" size="lg" icon-only="search-lg" label="Buscar"></x-import>
  <span class="rg-when-light"><x-import component-from-global-scope="Jotis.Button" hierarchy="tertiary" size="lg" icon-only="moon-01" label="Usar tema oscuro"></x-import></span>
  <span class="rg-when-dark"><x-import component-from-global-scope="Jotis.Button" hierarchy="tertiary" size="lg" icon-only="sun" label="Usar tema claro"></x-import></span>
  <x-import component-from-global-scope="Jotis.Button" hierarchy="tertiary" size="lg" icon-only="menu-01" label="Abrir menú" aria-expanded="false"></x-import>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":56}}'>
class Component extends DCLogic {
  renderVals() { return { n: { s24: 24 } }; }
}
</script>
</body>
</html>
