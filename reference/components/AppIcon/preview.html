<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>AppIcon</title>
<style>
html,body{margin:0;background:var(--bg-primary)} body{padding:16px;font-family:var(--font-body);color:var(--text-secondary)}
.cap{font-size:12px;line-height:18px;color:var(--text-tertiary)}
.grid{display:grid;grid-template-columns:88px repeat(5,64px);gap:12px 16px;align-items:center;justify-items:center}
.grid .name{justify-self:start;font-size:14px;font-weight:600;color:var(--text-primary)}
.sizes{display:flex;align-items:flex-end;gap:20px;margin-top:28px}
.sizes figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
h4{margin:0 0 12px;font-size:14px;font-weight:600;color:var(--text-primary)}
</style></head>
<body>
<div id="root" class="jm-root"></div>
<script>
  var J = window.Jotis, h = React.createElement, F = React.Fragment;
  var apps = ['ornatus','vinculum','pecunia','emptor','regula'];
  var cols = [['default','Principal'],['solid','Sólido'],['light','Claro'],['mono','Mono'],['maskable','Maskable']];
  ReactDOM.createRoot(document.getElementById('root')).render(h(F, null,
    h('h4', null, 'Familia y variantes'),
    h('div', { className: 'grid' },
      h('span'), cols.map(function (c) { return h('span', { key: c[0], className: 'cap' }, c[1]); }),
      apps.map(function (a) {
        return h(F, { key: a },
          h('span', { className: 'name' }, J.appIcons[a].name),
          cols.map(function (c) {
            return c[0] === 'maskable'
              ? h(J.AppIcon, { key: c[0], app: a, size: 48, shape: 'square' })
              : h(J.AppIcon, { key: c[0], app: a, size: 48, variant: c[0] });
          }));
      })),
    h('div', { className: 'sizes' }, [128, 96, 64, 48, 32, 24, 20, 16].map(function (s) {
      return h('figure', { key: s }, h(J.AppIcon, { app: 'ornatus', size: s }), h('figcaption', { className: 'cap' }, s + ' px'));
    }))));
</script>
</body>
</html>
