<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>BackgroundPattern</title>
<style>html,body{margin:0;background:var(--bg-primary)} body{padding:16px}</style></head>
<body>
<div id="root" class="jm-root"></div>
<script>
  var J = window.Jotis, h = React.createElement, F = React.Fragment;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))',gap:16}},
 [['grid','radial','md'],['grid-dot','radial','md'],['grid-check','radial','sm'],['circles','radial','sm'],['squares','radial','sm'],['grid','linear-down','sm']].map(function(c,i){
  return h('div',{key:i},h('div',{style:{position:'relative',height:200,borderRadius:12,boxShadow:'inset 0 0 0 1px var(--border-secondary)',overflow:'hidden'}},
   h(J.BackgroundPattern,{pattern:c[0],mask:c[1],size:c[2]}),
   h('div',{style:{position:'relative',height:'100%',display:'grid',placeItems:'center'}},h(J.FeaturedIcon,{icon:'stars-02',variant:'modern',color:'gray',size:'lg'}))),
   h('p',{className:'jm-hint',style:{marginTop:8}},h('code',null,c[0]),' · ',c[1],' · ',c[2]));})));
</script>
</body>
</html>
