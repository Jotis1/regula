<head><meta charset="utf-8"><title>Icon</title>
<style>html,body{margin:0;background:var(--bg-primary)} body{padding:16px}</style></head>
<body>
<div id="root" class="jm-root"></div>
<script>
  var J = window.Jotis, h = React.createElement, F = React.Fragment;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{display:'flex',flexWrap:'wrap',gap:16,color:'var(--fg-secondary)'}},J.iconNames.map(function(n){return h('span',{key:n,title:n},h(J.Icon,{name:n,size:24}))})));
