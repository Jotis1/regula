<!-- @dsCard group="Stream · Alertas" height=490 width=1040 subtitle="Seguidor, suscripción, raid y donación" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>StreamAlert</title>
<style>html,body{margin:0;background:var(--bg-primary)} body{padding:16px} .grid{display:grid;grid-template-columns:repeat(2,480px);gap:16px;align-items:start}</style></head>
<body>
<div id="root" class="jm-root"></div>
<script>
  document.documentElement.setAttribute('data-theme', 'dark');
  var J = window.Jotis, h = React.createElement, useState = React.useState;
  function Demo() {
    var s = useState(0), n = s[0], set = s[1];
    return h('div', null,
      h('div', { className: 'grid' },
        h(J.StreamAlert, { key: 'f' + n, type: 'follow', user: 'lucia_pixel', state: n ? 'enter' : undefined }),
        h(J.StreamAlert, { type: 'sub', user: 'nachoXL', tier: 1, message: 'Primera vez que me suscribo a algo que no es una plataforma de series.' }),
        h(J.StreamAlert, { type: 'raid', user: 'TioBigotes', amount: 1284 }),
        h(J.StreamAlert, { type: 'donation', user: 'Marta_en_Directo', amount: 5, message: 'Para el café. Que se note la ojera.' })),
      h('div', { style: { marginTop: 16 } }, h(J.Button, { hierarchy: 'secondary', size: 'sm', onClick: function () { set(n + 1); } }, 'Repetir entrada')));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
