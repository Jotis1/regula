<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>ChannelPanel</title>
<style>html,body{margin:0;background:var(--bg-primary)} body{padding:24px} .row{display:flex;gap:24px;align-items:flex-start}</style></head>
<body>
<div id="root" class="jm-root"></div>
<script>
  document.documentElement.setAttribute('data-theme', 'dark');
  var J = window.Jotis, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'row' },
    h(J.ChannelPanel, { title: 'Sobre el canal', icon: 'user-01', action: { label: 'Ver todos los enlaces', icon: 'arrow-right', href: '#' } },
      h('p', null, 'Directos tranquilos, juegos a medias y conversación sin guion.'),
      h('p', null, 'Si es tu primera vez, siéntate. Hay sitio.')),
    h(J.ChannelPanel, { title: 'Horario', icon: 'calendar', rows: [
      { label: 'Lunes', value: '20:00' }, { label: 'Miércoles', value: '20:00' }, { label: 'Viernes', value: '22:00' }] }),
    h(J.ChannelPanel, { title: 'Normas', icon: 'shield-tick' },
      h('p', null, 'Respeto, sin spoilers y sin pedir que haga lo mismo que el streamer de ayer.'),
      h('p', null, 'Los moderadores tienen la última palabra y mucha paciencia.'))));
</script>
</body>
</html>
