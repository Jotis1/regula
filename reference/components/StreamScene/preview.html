<!-- @dsCard group="Stream · Escenas" height=620 width=1000 subtitle="Empezando, pausa, final y offline en 1920×1080" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>StreamScene</title>
<style>html,body{margin:0;background:var(--bg-primary)} body{padding:16px} .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}</style></head>
<body>
<div id="root" class="jm-root"></div>
<script>
  document.documentElement.setAttribute('data-theme', 'dark');
  var J = window.Jotis, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'grid' },
    h(J.StreamScene, { variant: 'starting', seconds: 300, countdownLabel: 'Para empezar' }),
    h(J.StreamScene, { variant: 'brb', seconds: 480, countdownLabel: 'Vuelvo en' }),
    h(J.StreamScene, { variant: 'ending', next: 'Próximo directo: jueves, 20:00' }),
    h(J.StreamScene, { variant: 'offline', next: 'Lunes, miércoles y viernes · 20:00' })));
</script>
</body>
</html>
