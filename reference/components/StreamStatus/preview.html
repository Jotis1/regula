<!-- @dsCard group="Stream · Overlay" height=200 width=800 subtitle="En directo, reemisión y sin directo" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>StreamStatus</title>
<style>html,body{margin:0;background:var(--bg-primary)} body{padding:24px} .col{display:flex;flex-direction:column;gap:16px;align-items:flex-start}</style></head>
<body>
<div id="root" class="jm-root"></div>
<script>
  document.documentElement.setAttribute('data-theme', 'dark');
  var J = window.Jotis, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'col' },
    h(J.StreamStatus, { status: 'live', viewers: 1284, uptime: '2:14:05', category: 'Just Chatting' }),
    h(J.StreamStatus, { status: 'rerun', category: 'Reemisión del jueves' }),
    h(J.StreamStatus, { status: 'offline' })));
</script>
</body>
</html>
