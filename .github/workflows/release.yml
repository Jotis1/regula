# Publicación con Changesets. Solo corre cuando CI termina bien tras un push a main (workflow_run), y trabaja
# sobre el mismo commit que CI probó. Si hay changesets pendientes abre o actualiza el PR de versión; al fusionar
# ese PR, empaqueta con `bun pm pack` y publica cada .tgz con procedencia.
#
# npm con trusted publishing: sin token. En npmjs.com, cada paquete tiene que tener como editor de confianza este
# repositorio (Jotis1/regula) y este flujo (release.yml). npm solo deja configurarlo en paquetes que ya existen,
# así que la primera publicación usa un token temporal (secreto NPM_TOKEN). Al borrar el secreto, este mismo flujo
# pasa a trusted publishing sin cambiar nada.
name: Release

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]

concurrency:
    group: release
    cancel-in-progress: false

permissions: {}

jobs:
    release:
        name: Versión y publicación
        if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: write # etiquetas y rama del PR de versión
            pull-requests: write # PR de versión
            id-token: write # trusted publishing y procedencia
        env:
            # Solo un sí o un no: el token en sí no se expone a los demás pasos.
            HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            # Trusted publishing necesita npm ≥ 11.5.1. Sin `registry-url`: así no se configura ningún token.
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: npm install -g npm@latest
            - run: bun install --frozen-lockfile
            - name: Build de los paquetes
              run: bunx turbo run build --filter=./packages/*
            # La acción solo abre o actualiza el PR de versión. No le pasamos `publish`: cuando publica escribe su
            # propio ~/.npmrc con NPM_TOKEN (vacío sin token), y eso estorbaría a trusted publishing.
            - name: PR de versión
              id: changesets
              uses: changesets/action@v1
              with:
                  version: bun run version-packages
                  title: "Versión de los paquetes"
                  commit: "Versión de los paquetes"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            # Sin changesets pendientes (se acaba de fusionar el PR de versión): se publica lo que no esté en npm.
            - name: Token temporal de npm (solo la primera publicación)
              if: steps.changesets.outputs.hasChangesets == 'false' && env.HAS_NPM_TOKEN == 'true'
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
            # Lo que trusted publishing necesita para funcionar, sin enseñar ningún valor secreto: npm ≥ 11.5.1 y
            # las variables de OIDC de GitHub (solo si existen). Si npm no las ve, falla con ENEEDAUTH sin más.
            - name: Diagnóstico de npm (trusted publishing)
              if: steps.changesets.outputs.hasChangesets == 'false'
              run: |
                  echo "node $(node --version) · npm $(npm --version) · npm en $(command -v npm)"
                  for v in GITHUB_ACTIONS ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
                      if [ -n "${!v}" ]; then echo "$v: presente"; else echo "$v: AUSENTE"; fi
                  done
                  npm config get registry
                  ls -la "$HOME/.npmrc" 2>/dev/null || echo "sin ~/.npmrc"
            - name: Publicación
              if: steps.changesets.outputs.hasChangesets == 'false'
              # verbose: npm cuenta el intento de OIDC y, si falla, por qué
              env:
                  NPM_CONFIG_LOGLEVEL: verbose
              run: bun run release
