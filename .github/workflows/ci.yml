# Integración continua: en cada PR y en cada push a main. La publicación (release.yml) solo corre si este flujo
# termina bien en main, así que todo lo que bloquea una versión está aquí.
name: CI

on:
    pull_request:
    push:
        branches: [main]
    # Solo para el job de capturas (design D4): captura en Windows los ejemplos pedidos y sube las PNG
    workflow_dispatch:
        inputs:
            componentes:
                description: "Componentes a capturar, separados por espacios (p. ej. «Button Badge»)"
                required: true
                type: string

concurrency:
    # La ejecución manual de capturas va en su propio grupo: no cancela el CI de la misma rama
    group: ci-${{ github.event_name == 'workflow_dispatch' && 'capturas' || 'ci' }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # Comprobaciones sin navegador: formato y lint, tipos, tests unitarios (con axe en jsdom), build, colores,
    # exports y tipos publicados, tamaño por componente y paquetes sin `workspace:`.
    checks:
        name: Comprobaciones
        if: github.event_name != 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - name: Biome
              run: bunx biome ci .
            - name: Nada lee reference/ (congelada)
              run: bun run check:reference
            - name: Tipos, tests y build
              run: bunx turbo run build typecheck test
            # El generador del artefacto (design D6) no necesita red: se ejecuta en un espacio de red vacío, como el
            # usuario del runner (sus tests sin navegador ya corren en el paso anterior, con la red bloqueada).
            - name: Artefacto "Jotis.me" sin red
              run: sudo unshare --net --setuid "$(id -u)" --setgid "$(id -g)" -- env "PATH=$PATH" "HOME=$HOME" bun run artifact:build
            - name: Colores fuera de los tokens
              run: bun run check:colors
              working-directory: packages/react
            - name: publint y arethetypeswrong
              run: |
                  for p in tokens icons react; do
                    (cd packages/$p && bun run check:package)
                  done
            - name: Tamaño por componente
              run: bun run check:size
              working-directory: packages/react
            - name: "Paquetes sin workspace:"
              run: bun run scripts/pack.ts

    # Pruebas con navegador. En Windows porque las capturas aprobadas de la paridad visual se capturaron en Windows: el
    # suavizado del texto cambia entre sistemas y en Linux superaría el umbral del 2 %.
    browser:
        name: Navegador (web, ejemplos y Lighthouse)
        if: github.event_name != 'workflow_dispatch'
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - name: Build
              run: bunx turbo run build
            # Firefox y WebKit solo corren los e2e de e2e/cross-browser/ (proyectos de playwright.config.ts)
            - name: Navegadores de Playwright
              run: bunx playwright install chromium firefox webkit
              working-directory: apps/docs
            - name: Tokens e iconos (fuentes sin red, capturas)
              shell: bash
              run: |
                  (cd packages/tokens && bun run test:e2e)
                  (cd packages/icons && bun run test:e2e)
            - name: Web (funcional, axe y paridad visual)
              run: bunx playwright test
              working-directory: apps/docs
            - name: Ejemplo Next.js (sin avisos de hidratación)
              run: bunx playwright test
              working-directory: examples/next
            - name: Ejemplo Astro (sin JS en estáticos, isla con teclado)
              run: bunx playwright test
              working-directory: examples/astro
            # Aquí y no en Comprobaciones: las vistas previas se comparan con las capturas aprobadas, hechas en Windows
            - name: Artefacto "Jotis.me" (React 18, hoja y vistas previas frente a las capturas)
              run: bun run test:e2e
              working-directory: scripts/artifact
            - name: Lighthouse (móvil, ≥ 90 en rendimiento y accesibilidad)
              id: lighthouse
              shell: bash
              working-directory: apps/docs
              run: |
                  set -o pipefail
                  mkdir -p .lighthouseci
                  bun run test:lighthouse 2>&1 | tee .lighthouseci/run.log
            # Puntuaciones (o el error) como anotaciones: visibles en la ejecución y por la API pública.
            - name: Resumen de Lighthouse
              if: always() && steps.lighthouse.outcome != 'skipped'
              working-directory: apps/docs
              run: bun run scripts/lighthouse-summary.ts
            - name: Resultados si algo falla
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: resultados-navegador
                  # `.lighthouseci` es una carpeta oculta: sin esto, upload-artifact la deja fuera.
                  include-hidden-files: true
                  path: |
                      apps/docs/test-results/
                      apps/docs/.lighthouseci/
                      examples/*/test-results/
                      scripts/artifact/test-results/
                  retention-days: 7

    # Capturas aprobadas (design D4), a mano desde Actions: en Windows, como el job de navegador, para que el render
    # sea el mismo. Las PNG salen como artifact del run; se revisan y se meten en el PR, que es donde se aprueban.
    capturas:
        name: Capturas aprobadas
        if: github.event_name == 'workflow_dispatch'
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - name: Build
              run: bunx turbo run build
            - name: Chromium de Playwright
              run: bunx playwright install chromium
              working-directory: apps/docs
            - name: Capturar
              shell: bash
              working-directory: apps/docs
              env:
                  COMPONENTES: ${{ inputs.componentes }}
              # Sin comillas a propósito: un argumento por nombre. El script rechaza los que no están en el catálogo.
              run: bun run scripts/capture-approved.ts $COMPONENTES --out capturas
            - uses: actions/upload-artifact@v4
              with:
                  name: capturas-aprobadas
                  path: apps/docs/capturas/
                  retention-days: 7
