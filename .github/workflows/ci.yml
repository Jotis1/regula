# Integración continua: en cada PR y en cada push a main. La publicación (release.yml) solo corre si este flujo
# termina bien en main, así que todo lo que bloquea una versión está aquí.
name: CI

on:
    pull_request:
    push:
        branches: [main]
    # Solo para el job de capturas (design D4): captura en Windows los ejemplos pedidos y sube las PNG
    workflow_dispatch:
        inputs:
            componentes:
                description: "Componentes a capturar, separados por espacios (p. ej. «Button Badge»)"
                required: true
                type: string

concurrency:
    # La ejecución manual de capturas va en su propio grupo: no cancela el CI de la misma rama
    group: ci-${{ github.event_name == 'workflow_dispatch' && 'capturas' || 'ci' }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # INT-002: ¿hay que comprobar código? `code=false` solo si todo lo cambiado está en las rutas que ninguna
    # comprobación lee (scripts/ci-changes.ts). Los jobs de código se saltan entonces y el job «CI» lo da por bueno.
    changes:
        name: Cambios
        if: github.event_name != 'workflow_dispatch'
        runs-on: ubuntu-latest
        outputs:
            code: ${{ steps.detect.outputs.code }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - name: ¿Cambia código?
              id: detect
              run: bun run scripts/ci-changes.ts "$BASE" "$HEAD"
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
                  HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

    # Comprobaciones sin navegador: formato y lint, tipos, tests unitarios (con axe en jsdom), build, colores,
    # exports y tipos publicados, tamaño por componente y paquetes sin `workspace:`.
    checks:
        name: Comprobaciones
        needs: changes
        if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        # INT-006: caché remota de Turbo del equipo de Vercel. Sin el secreto (PR desde forks), Turbo construye en local
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - name: Biome
              run: bunx biome ci --error-on-warnings .
            - name: Nada lee reference/ (congelada)
              run: bun run check:reference
            # NAM-001 y NAM-002: los paquetes privados en dominio inverso y los publicados bajo @jotis-me
            - name: Nombres de paquete
              run: bun run check:names
            # INT-001, INT-003, INT-005, INT-006 e INT-008, sobre este mismo workflow y los vercel.json de las apps
            - name: Normas de CI
              run: bun run check:ci
            # STK, COD, DOC y VER: stack, tsconfig, supresiones, JSDoc, README y dependencias
            - name: Normas de desarrollo
              run: bun run check:dev
            - name: Tipos, tests y build
              run: bunx turbo run build typecheck test
            # El generador del artefacto (design D6) no necesita red: se ejecuta en un espacio de red vacío, como el
            # usuario del runner (sus tests sin navegador ya corren en el paso anterior, con la red bloqueada).
            - name: Artefacto "Jotis.me" sin red
              run: sudo unshare --net --setuid "$(id -u)" --setgid "$(id -g)" -- env "PATH=$PATH" "HOME=$HOME" bun run artifact:build
            - name: Colores fuera de los tokens
              run: bun run check:colors
              working-directory: packages/react
            - name: publint y arethetypeswrong
              run: |
                  for p in tokens assets react; do
                    (cd packages/$p && bun run check:package)
                  done
            - name: Tamaño por componente
              run: bun run check:size
              working-directory: packages/react
            # Sobre la web que ya construyó `turbo run build`: JS estático por página frente a `js-budget.json`.
            - name: JS por página de la web
              run: bun run check:js
              working-directory: apps/docs
            - name: "Paquetes sin workspace:"
              run: bun run scripts/pack.ts

    # GIT-001: todos los commits de la PR siguen Conventional Commits. Los de fusión que genera GitHub los ignora
    # commitlint; lo que ya está en main no se comprueba (solo el rango de la PR).
    commits:
        name: Commits
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - name: Conventional Commits
              run: bunx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
            # VER-002: si la PR cambia lo que publica un paquete, trae un changeset que lo nombra (o uno vacío). El PR de
            # versión de changesets queda fuera: borra los changesets a propósito.
            - name: Changesets
              run: bun run scripts/check-changesets.ts "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" "${{ github.head_ref }}"

    # Pruebas con navegador. En Windows porque las capturas aprobadas de la paridad visual se capturaron en Windows: el
    # suavizado del texto cambia entre sistemas y en Linux superaría el umbral del 2 %.
    # INT-007: los e2e de la web (~21 min de una vez) van repartidos en shards por archivo de test; el resto de pruebas
    # con navegador, en un job aparte que corre a la vez.
    browser-e2e:
        name: Navegador (web ${{ matrix.shard }}/3)
        needs: changes
        if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true'
        runs-on: windows-latest
        strategy:
            # Un shard que falla no cancela los demás: así se ven todos los fallos de una pasada
            fail-fast: false
            matrix:
                shard: [1, 2, 3]
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - name: Build
              run: bunx turbo run build
            # Firefox y WebKit solo corren los e2e de e2e/cross-browser/ (proyectos de playwright.config.ts)
            - name: Navegadores de Playwright
              run: bunx playwright install chromium firefox webkit
              working-directory: apps/docs
            - name: Web (funcional, axe y paridad visual)
              # Por test y no por archivo: repartidos por archivo, uno de los shards tardaba 885 s y los otros 303 y 219.
              # Ningún e2e comparte estado entre tests (sin describe.serial ni beforeAll), así que pueden ir por separado.
              run: bunx playwright test --fully-parallel --shard=${{ matrix.shard }}/${{ strategy.job-total }}
              working-directory: apps/docs
            - name: Resultados si algo falla
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: resultados-e2e-${{ matrix.shard }}
                  path: apps/docs/test-results/
                  retention-days: 7

    browser-other:
        name: Navegador (ejemplos, artefacto y Lighthouse)
        needs: changes
        if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true'
        runs-on: windows-latest
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - name: Build
              run: bunx turbo run build
            - name: Chromium de Playwright
              run: bunx playwright install chromium
              working-directory: apps/docs
            - name: Tokens y assets (fuentes sin red, capturas)
              shell: bash
              run: |
                  (cd packages/tokens && bun run test:e2e)
                  (cd packages/assets && bun run test:e2e)
            - name: Ejemplo Next.js (sin avisos de hidratación)
              run: bunx playwright test
              working-directory: examples/next
            - name: Ejemplo Astro (sin JS en estáticos, isla con teclado)
              run: bunx playwright test
              working-directory: examples/astro
            # Aquí y no en Comprobaciones: las vistas previas se comparan con las capturas aprobadas, hechas en Windows
            - name: Artefacto "Jotis.me" (React 18, hoja y vistas previas frente a las capturas)
              run: bun run test:e2e
              working-directory: scripts/artifact
            - name: Lighthouse (móvil, ≥ 90 en rendimiento y accesibilidad)
              id: lighthouse
              shell: bash
              working-directory: apps/docs
              run: |
                  set -o pipefail
                  mkdir -p .lighthouseci
                  bun run test:lighthouse 2>&1 | tee .lighthouseci/run.log
            # Puntuaciones (o el error) como anotaciones: visibles en la ejecución y por la API pública.
            - name: Resumen de Lighthouse
              if: always() && steps.lighthouse.outcome != 'skipped'
              working-directory: apps/docs
              run: bun run scripts/lighthouse-summary.ts
            - name: Resultados si algo falla
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: resultados-navegador
                  # `.lighthouseci` es una carpeta oculta: sin esto, upload-artifact la deja fuera.
                  include-hidden-files: true
                  path: |
                      apps/docs/.lighthouseci/
                      examples/*/test-results/
                      packages/*/test-results/
                      scripts/artifact/test-results/
                  retention-days: 7

    # INT-003: el único check obligatorio del ruleset. GitHub da por bueno un job saltado aunque se saltara porque falló
    # otro del que depende, así que este lee el resultado de cada uno (scripts/ci-gate.ts). Los argumentos son los jobs
    # que tienen que correr siempre que hay código.
    gate:
        name: CI
        needs: [changes, checks, commits, browser-e2e, browser-other]
        if: always() && github.event_name != 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - name: Resultado de cada job
              run: bun run scripts/ci-gate.ts checks browser-e2e browser-other
              env:
                  NEEDS: ${{ toJSON(needs) }}

    # Capturas aprobadas (design D4), a mano desde Actions: en Windows, como el job de navegador, para que el render
    # sea el mismo. Las PNG salen como artifact del run; se revisan y se meten en el PR, que es donde se aprueban.
    capturas:
        name: Capturas aprobadas
        if: github.event_name == 'workflow_dispatch'
        runs-on: windows-latest
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - name: Build
              run: bunx turbo run build
            - name: Chromium de Playwright
              run: bunx playwright install chromium
              working-directory: apps/docs
            - name: Capturar
              shell: bash
              working-directory: apps/docs
              env:
                  COMPONENTES: ${{ inputs.componentes }}
              # Sin comillas a propósito: un argumento por nombre. El script rechaza los que no están en el catálogo.
              run: bun run scripts/capture-approved.ts $COMPONENTES --out capturas
            - uses: actions/upload-artifact@v7
              with:
                  name: capturas-aprobadas
                  path: apps/docs/capturas/
                  retention-days: 7
